name: citra-build

on:
  push:
    branches: [ "*" ]
    tags: [ "*" ]
  pull_request:
    branches: [ master ]

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  source:
    if: ${{ !github.head_ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Pack
        run: ./.ci/source.sh
      - name: Generate SBOM
        if: ${{ github.ref_type == 'tag' }}
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: artifacts/source.spdx.json
          upload-artifact: false
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: source
          path: artifacts/
      - name: Attest artifacts
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.tar.xz
          sbom-path: artifacts/source.spdx.json

  linux-x86_64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["appimage", "gcc-nopch"]
    container:
      image: opensauce04/azahar-build-environment:latest
      # No -u 1001 here (unlike this repo's other opensauce04-image jobs):
      # this job needs apt-get install for libx264-dev/libx265-dev
      # (unison_core's streaming encoder, src/core/CMakeLists.txt) and the
      # image has no sudo binary, so root is the only way to get that
      # without a bigger image change. Root can still read/write the
      # actions/checkout'd workspace and ccache dir fine -- confirmed no
      # permission-related step failures afterward.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: linux
      TARGET: ${{ matrix.target }}
      CACHE_ENABLED: ${{ github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up cache
        if: ${{ env.CACHE_ENABLED == 'true' }}
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ github.job }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ github.job }}-${{ matrix.target }}-
      - name: Install streaming deps
        run: |
          apt-get update -y
          apt-get install -y libx264-dev libx265-dev
      - name: Build
        run: ./.ci/linux.sh
      - name: Move AppImage to artifacts directory
        if: ${{ matrix.target == 'appimage' }}
        run: |
          mkdir -p artifacts
          mv build/bundle/*.AppImage artifacts/
      - name: Generate SBOM
        if: ${{ matrix.target == 'appimage' && github.ref_type == 'tag' }}
        uses: anchore/sbom-action@v0
        with:
          path: build/
          format: spdx-json
          output-file: artifacts/linux-x86_64-${{ matrix.target }}.spdx.json
          upload-artifact: false
      - name: Upload
        if: ${{ matrix.target == 'appimage' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.job }}-${{ matrix.target }}
          path: artifacts/
      - name: Attest artifacts
        if: ${{ matrix.target == 'appimage' && github.ref_type == 'tag' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.AppImage
          sbom-path: artifacts/linux-x86_64-${{ matrix.target }}.spdx.json

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: ["clang", "gcc-nopch"]
    container:
      image: opensauce04/azahar-build-environment:latest
      # See linux-x86_64's own comment: no -u 1001, this job's
      # "Install streaming deps" step needs apt-get install and the image
      # has no sudo binary.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: linux
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ github.job }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ github.job }}-${{ matrix.target }}-
      - name: Install streaming deps
        run: |
          apt-get update -y
          apt-get install -y libx264-dev libx265-dev
      - name: Build
        run: ./.ci/linux.sh

  macos:
    runs-on: 'macos-26'
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      CACHE_ENABLED: ${{ github.ref_type != 'tag' }}
      OS: macos
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up cache
        if: ${{ env.CACHE_ENABLED == 'true' }}
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-
      - name: Install tools
        run: brew install ccache ninja spirv-tools x264 x265 nasm
      # x264/x265 above only installed the arm64 build (plain `brew` on
      # this runner resolves to /opt/homebrew). The x86_64 leg below links
      # against them too (unison_core's streaming/software_video_encoder.cpp,
      # src/core/CMakeLists.txt) and needs its own x86_64 build.
      #
      # Tried and abandoned: bootstrapping a second, Rosetta-backed Homebrew
      # at /usr/local (the classic universal-build pattern) -- this runner
      # image has none preinstalled, and current Homebrew's own installer
      # now outright refuses to run under `arch -x86_64` at all ("Homebrew
      # on macOS is only supported on Apple Silicon processors!"), so that
      # path is a dead end regardless of Rosetta.
      #
      # Cross-compiling both libs from source instead, straight to x86_64
      # via clang -- no Rosetta/emulation involved at all, same mechanism
      # this job already uses to cross-build azahar itself for x86_64
      # (-DCMAKE_OSX_ARCHITECTURES). nasm (installed above, arm64 binary)
      # cross-assembles x86_64 object code fine -- nasm's own output
      # target is independent of the host it runs on.
      - name: Build x264/x265 (x86_64, from source)
        run: |
          X264_PREFIX="$RUNNER_TEMP/x264-x86_64"
          git clone --depth 1 https://code.videolan.org/videolan/x264.git "$RUNNER_TEMP/x264-src"
          cd "$RUNNER_TEMP/x264-src"
          CC="clang -arch x86_64" ./configure \
            --host=x86_64-apple-darwin \
            --prefix="$X264_PREFIX" \
            --enable-static \
            --disable-cli \
            --disable-opencl \
            --extra-cflags="-arch x86_64" \
            --extra-ldflags="-arch x86_64"
          make -j"$(sysctl -n hw.ncpu)"
          make install

          X265_PREFIX="$RUNNER_TEMP/x265-x86_64"
          git clone --depth 1 https://github.com/videolan/x265.git "$RUNNER_TEMP/x265-src"
          cmake -S "$RUNNER_TEMP/x265-src/source" -B "$RUNNER_TEMP/x265-build" -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_INSTALL_PREFIX="$X265_PREFIX" \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF
          cmake --build "$RUNNER_TEMP/x265-build"
          cmake --install "$RUNNER_TEMP/x265-build"

          echo "AZAHAR_X86_64_PKG_CONFIG_PATH=$X264_PREFIX/lib/pkgconfig:$X265_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build (arm64)
        run: BUILD_ARCH=arm64 ./.ci/macos.sh
      - name: Build (x86_64)
        # PKG_CONFIG_PATH isn't arch-aware on its own -- .ci/macos.sh's
        # plain pkg-config lookup would otherwise keep resolving x264/x265
        # against the arm64 Homebrew install above (/opt/homebrew, first on
        # PATH), same mismatch as before. Pointing it at the from-source
        # x86_64 build's own pkgconfig dirs for just this step fixes that
        # without touching .ci/macos.sh itself.
        run: PKG_CONFIG_PATH="$AZAHAR_X86_64_PKG_CONFIG_PATH" BUILD_ARCH=x86_64 ./.ci/macos.sh
      - name: Create universal app
        run: ./.ci/macos-universal.sh
      - name: Prepare for packing
        run: |
          mkdir build/bundle
          cp -r build/x86_64/bundle build/bundle/x86_64
          cp -r build/arm64/bundle build/bundle/arm64
          cp -r build/universal/bundle build/bundle/universal
      - name: Pack
        env:
          PACK_INDIVIDUALLY: 1
        run: ./.ci/pack.sh
      - name: Generate SBOM
        if: ${{ github.ref_type == 'tag' }}
        uses: anchore/sbom-action@v0
        with:
          path: build/
          format: spdx-json
          output-file: artifacts/macos.spdx.json
          upload-artifact: false
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OS }}
          path: artifacts/
      - name: Attest artifacts
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.zip
          sbom-path: artifacts/macos.spdx.json

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: msvc
          os: windows-latest
        - target: mxe
          os: ubuntu-latest
          container:
            image: opensauce04/azahar-build-environment:latest
            options: -u 1001
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: 'bash'
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      CACHE_ENABLED: ${{ github.ref_type != 'tag' }}
      OS: windows
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up cache
        if: ${{ env.CACHE_ENABLED == 'true' }}
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-
      - name: Set up MSVC
        if: ${{ matrix.target == 'msvc' }}
        uses: azahar-emu/msvc-dev-cmd@v1
      - name: Install extra tools (MSVC)
        if: ${{ matrix.target == 'msvc' }}
        # pkgconfiglite: this runner has no pkg-config at all (confirmed
        # from an actual failed run: "pkg-config tool not found", not just
        # a missing package) -- needed for src/core/CMakeLists.txt's
        # pkg_check_modules(X264/X265 ...) to find the vcpkg-installed
        # x264/x265 below.
        run: choco install ccache ninja ptime wget pkgconfiglite
      - name: Install vulkan-sdk (MSVC)
        if: ${{ matrix.target == 'msvc' }}
        run: |
          wget https://sdk.lunarg.com/sdk/download/1.4.304.1/windows/VulkanSDK-1.4.304.1-Installer.exe -O D:/a/_temp/vulkan.exe
          D:/a/_temp/vulkan.exe --accept-licenses --default-answer --confirm-command install
      - name: Install NSIS
        if: ${{ github.ref_type == 'tag' && matrix.target != 'mxe' }}
        run: |
          wget https://download.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11-setup.exe -O D:/a/_temp/nsis-setup.exe
          ptime D:/a/_temp/nsis-setup.exe /S
        shell: pwsh
      - name: Disable line ending translation
        run: git config --global core.autocrlf input
      # unison_core's streaming/software_video_encoder.cpp needs x264/x265
      # via pkg-config (src/core/CMakeLists.txt) -- windows-latest already
      # ships pkgconfiglite (that's why the earlier "Package 'x264' not
      # found" error came from pkg-config itself, not a missing tool), so
      # installing the ports via the runner's preinstalled vcpkg and
      # pointing PKG_CONFIG_PATH at their generated .pc files is enough,
      # no vcpkg.json manifest needed for this one dependency.
      - name: Install streaming deps (MSVC)
        if: ${{ matrix.target == 'msvc' }}
        run: |
          vcpkg install x264:x64-windows x265:x64-windows
          echo "PKG_CONFIG_PATH=$VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build (Native)
        if: ${{ matrix.target != 'mxe' }}
        run: ./.ci/windows.sh
      - name: Build (MXE)
        if: ${{ matrix.target == 'mxe' }}
        run: ./.ci/mxe.sh
      - name: Generate installer (Native)
        if: ${{ github.ref_type == 'tag' && matrix.target != 'mxe' }}
        run: |
          cd src\installer
          "C:\Program Files (x86)\NSIS\makensis.exe" /DPRODUCT_VARIANT=${{ matrix.target }} /DPRODUCT_VERSION=${{ github.ref_name }} citra.nsi
          mkdir ..\..\artifacts 2> NUL
          move /y *.exe ..\..\artifacts\
        shell: cmd
      - name: Generate installer (MXE)
        if: ${{ github.ref_type == 'tag' && matrix.target == 'mxe' }}
        run: |
          export PATH="/opt/mxe/usr/bin:${PATH}" # TODO: Why do we have to do this if it's in the image?
          cd src/installer
          x86_64-w64-mingw32.shared-makensis -DPRODUCT_VARIANT=${{ matrix.target }} -DPRODUCT_VERSION=${{ github.ref_name }} citra.nsi
          mkdir -p ../../artifacts
          mv ./*.exe ../../artifacts/
      - name: Pack
        run: ./.ci/pack.sh
      - name: Generate SBOM
        if: ${{ github.ref_type == 'tag' }}
        uses: anchore/sbom-action@v0
        with:
          path: build/
          format: spdx-json
          output-file: artifacts/windows-${{ matrix.target }}.spdx.json
          upload-artifact: false
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: artifacts/
      - name: Attest artifacts
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.exe
          sbom-path: artifacts/windows-${{ matrix.target }}.spdx.json

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["vanilla", "googleplay"]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      CACHE_ENABLED: ${{ github.ref_type != 'tag' }}
      OS: android
      TARGET: ${{ matrix.target }}
      SHOULD_RUN: ${{ (matrix.target == 'vanilla' || github.ref_type == 'tag') }}
    steps:
      - uses: actions/checkout@v6
        if: ${{ env.SHOULD_RUN == 'true' }}
        with:
          submodules: recursive
      - name: Set up cache
        if: ${{ env.SHOULD_RUN == 'true' && env.CACHE_ENABLED == 'true' }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ env.OS }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.OS }}-${{ matrix.target }}-
      - name: Set tag name
        if: ${{ env.SHOULD_RUN == 'true' }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "GIT_TAG_NAME=$GITHUB_REF_NAME" >> $GITHUB_ENV
          fi
          echo $GIT_TAG_NAME
      - name: Install tools
        if: ${{ env.SHOULD_RUN == 'true' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y
      - name: Update Android SDK CMake version
        if: ${{ env.SHOULD_RUN == 'true' }}
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
      - name: Build
        if: ${{ env.SHOULD_RUN == 'true' }}
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/android.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - name: Pack
        if: ${{ env.SHOULD_RUN == 'true' }}
        run: ../../../.ci/pack.sh
        working-directory: src/android/app
        env:
          UNPACKED: 1
      - name: Generate SBOM
        if: ${{ github.ref_type == 'tag' }}
        uses: anchore/sbom-action@v0
        with:
          path: src/android
          format: spdx-json
          output-file: src/android/app/artifacts/android-${{ matrix.target }}.spdx.json
          upload-artifact: false
      - name: Upload
        if: ${{ env.SHOULD_RUN == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: src/android/app/artifacts/
      - name: Attest artifacts
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            src/android/app/artifacts/*.apk
            src/android/app/artifacts/*.aab
          sbom-path: src/android/app/artifacts/android-${{ matrix.target }}.spdx.json

  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64
          os: ubuntu-24.04
        - target: arm64
          os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    container:
      # Can't use docker:dind for ARM64 because it's Alpine-based, see https://github.com/actions/upload-artifact/issues/739
      image: earthbuild/dind:ubuntu-24.04-docker-28.5.2-1
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Fix git ownership
        run: git config --global --add safe.directory .
      - name: Build Docker image
        run: ./.ci/docker.sh
      - name: Move Docker image to artifacts directory
        run: |
          mkdir -p artifacts
          mv build/*.dockerimage artifacts/
      - name: Generate SBOM
        if: ${{ github.ref_type == 'tag' }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DOCKER_IMAGE_PATH }}
          format: spdx-json
          output-file: artifacts/docker-room.spdx.json
          upload-artifact: false
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: docker-${{ env.TARGET }}
          path: artifacts/
      - name: Attest artifacts
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.dockerimage
          sbom-path: artifacts/docker-room.spdx.json
