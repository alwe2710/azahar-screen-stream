name: Unison smoke

# Fork-owned workflow, deliberately separate from the upstream-inherited
# citra-build.yml so future syncs from azahar-emu/azahar don't collide with
# anything unison-specific. Part of the Unison CI pipeline's build-smoke
# stage; see unison/docs/capabilities.md and the 5-repo drift snapshot in
# the plan this came from.
#
# citra-build.yml already triggers on push to every branch (`branches:
# ["*"]`), which covers wherever this fork's Unison work actually happens
# (currently `master`) -- no separate trigger fix needed here, unlike Cemu.

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  unison-freshness:
    name: externals/unison freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false # only need the gitlink SHA, not an actual checkout

      # Diagnostic only: reports drift, doesn't touch the submodule pin
      # itself. Unlike Cemu's dependencies/unison (which tracks `main` in
      # .gitmodules but whose real work happens on `transcoding` -- a real
      # mismatch), this fork's .gitmodules already declares the branch we
      # actually want (`main`), so there's no separate declared-branch
      # check here, just the commit-freshness comparison. Note: as of this
      # check being written, Unison's own `main` is itself still well
      # behind `transcoding` (unmerged) -- so "matches main" is a much
      # lower bar than "has every feature unison/Cemu currently have".
      - name: Compare pinned commit against Unison's main branch
        run: |
          set -euo pipefail
          EXPECTED_BRANCH="main"

          PINNED_SHA="$(git ls-tree HEAD externals/unison | awk '{print $3}')"
          LATEST_SHA="$(git ls-remote https://github.com/alwe2710/Unison.git "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"

          echo "Pinned externals/unison commit: $PINNED_SHA"
          echo "Latest commit on Unison's $EXPECTED_BRANCH: $LATEST_SHA"

          if [ "$PINNED_SHA" != "$LATEST_SHA" ]; then
            echo "::warning::externals/unison is pinned at $PINNED_SHA, which is behind Unison's $EXPECTED_BRANCH tip ($LATEST_SHA). Update with: git submodule update --remote externals/unison && git add externals/unison && git commit"
            exit 1
          fi
